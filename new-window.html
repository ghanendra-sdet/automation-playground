<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Window Practice Content</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: #0b0f19;
      color: #e2e8f0;
      padding: 2rem;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 2.5rem;
      background: rgba(17, 24, 39, 0.8);
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    h2 {
      margin-top: 0;
      color: #818cf8;
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .highlight {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      padding: 0.75rem;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      margin: 1.5rem 0;
      font-size: 1.1rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
      letter-spacing: 0.05em;
    }
    button {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 0.625rem 1.25rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 1rem;
      transition: background-color 0.2s;
    }
    button:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>New Tab / Window Opened</h2>
    <p>This page was opened successfully by clicking the button in the Multiple Windows section.</p>
    <div class="highlight" id="window-message" data-testid="new-window-message">Secret Code: PLAYWRIGHT_WINDOWS_CHALLENGE</div>
    <button id="close-window-btn" data-testid="close-window" onclick="window.close()">Close Window</button>
  </div>
</body>
</html>
