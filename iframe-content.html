<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe Practice Content</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: #0b0f19;
      color: #e2e8f0;
      padding: 1.5rem;
      margin: 0;
    }
    .container {
      border: 2px dashed #6366f1;
      border-radius: 8px;
      padding: 1.5rem;
      background: rgba(17, 24, 39, 0.6);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    h3 {
      margin-top: 0;
      color: #818cf8;
      font-size: 1.25rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      padding: 0.625rem;
      border: 1px solid #374151;
      border-radius: 6px;
      background: #1f2937;
      color: #fff;
      margin-bottom: 1.25rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #6366f1;
    }
    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 0.625rem 1.25rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    button:hover {
      background: #4338ca;
    }
    .status {
      margin-top: 1.25rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>Inside Iframe Context</h3>
    <p>This is a separate HTML page hosted in an iframe context.</p>
    <form id="iframe-form">
      <label for="iframe-input">Iframe Input Field</label>
      <input type="text" id="iframe-input" name="iframe-input-name" data-testid="iframe-input-test" aria-label="Iframe input field" placeholder="Type inside the iframe...">
      
      <button type="submit" id="iframe-submit" data-testid="iframe-submit-btn">Submit inside Iframe</button>
    </form>
    <div id="iframe-status" class="status"></div>
  </div>
  <script>
    document.getElementById('iframe-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('iframe-input').value;
      const statusDiv = document.getElementById('iframe-status');
      statusDiv.style.display = 'block';
      statusDiv.textContent = `Form submitted with value: "${val}"`;
    });
  </script>
</body>
</html>
